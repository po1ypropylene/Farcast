<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Farcast logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15183F"/>
      <stop offset="1" stop-color="#3B2FD9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB36B"/>
      <stop offset="1" stop-color="#FF4F86"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App icon base -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#shine)"/>

  <g transform="translate(0 17)">
    <!-- Monitor stand -->
    <rect x="472" y="650" width="80" height="90" fill="#FFFFFF" fill-opacity="0.28"/>
    <rect x="372" y="732" width="280" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.45"/>

    <!-- Monitor body (glass bezel) -->
    <rect x="202" y="222" width="620" height="440" rx="70" fill="#2A2E78" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6"/>
    <rect x="202" y="222" width="620" height="440" rx="70" fill="#FFFFFF" fill-opacity="0.08"/>

    <!-- Screen -->
    <rect x="242" y="262" width="540" height="360" rx="40" fill="url(#accent)"/>

    <!-- Broadcast symbol on screen -->
    <g fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round">
      <g opacity="1">
        <path d="M554.4 399.6 A60 60 0 0 1 554.4 484.4"/>
        <path d="M469.6 484.4 A60 60 0 0 1 469.6 399.6"/>
      </g>
      <g opacity="0.75">
        <path d="M586.2 367.8 A105 105 0 0 1 586.2 516.2"/>
        <path d="M437.8 516.2 A105 105 0 0 1 437.8 367.8"/>
      </g>
      <g opacity="0.5">
        <path d="M618.1 335.9 A150 150 0 0 1 618.1 548.1"/>
        <path d="M405.9 548.1 A150 150 0 0 1 405.9 335.9"/>
      </g>
    </g>
    <circle cx="512" cy="442" r="30" fill="#FFFFFF"/>
  </g>
</svg>
